<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Tracker — Vanilla JS (DOM + Events)</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #121733;
            --panel-2: #0f1430;
            --text: #e7eaf6;
            --muted: #a7b0d9;
            --accent: #6ea8fe;
            --accent-2: #8bd3ff;
            --danger: #ff6b6b;
            --ok: #22c55e;
            --ring: rgba(110,168,254,.45);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            background: radial-gradient(80% 120% at 20% 10%, #111842 0%, #080d1f 60%, #060a18 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 32px;
        }
        .app {
            width: 100%;
            max-width: 720px;
            background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
            padding: 28px;
            border: 1px solid rgba(255,255,255,.06);
        }
        h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: .3px; }
        .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

        /* Form */
        form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.04);
            color: var(--text);
            outline: none;
            transition: box-shadow .15s ease, border-color .15s ease;
        }
        input[type="text"]:focus { box-shadow: 0 0 0 6px var(--ring); border-color: var(--accent); }
        button.primary {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #0a1025;
            font-weight: 700;
            cursor: pointer;
        }
        button.primary:active { transform: translateY(1px); }

        .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .muted { color: var(--muted); font-size: 13px; }

        /* List */
        ul { list-style: none; margin: 12px 0 0; padding: 0; }
        li.todo { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.03); }
        li.todo + li.todo { margin-top: 8px; }
        .todo label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .todo input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--ok); }
        .todo .text { line-height: 1.3; }
        .todo.completed .text { text-decoration: line-through; opacity: .6; }

        .actions { display: flex; gap: 6px; }
        .btn {
            padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.04); color: var(--text); cursor: pointer; font-size: 13px;
        }
        .btn:hover { background: rgba(255,255,255,.08); }
        .btn-danger { border-color: rgba(255,107,107,.35); color: #ffd7d7; }
        .empty { text-align: center; color: var(--muted); padding: 16px; border: 1px dashed rgba(255,255,255,.1); border-radius: 12px; }
    </style>
</head>
<body>
<div class="app" role="application" aria-label="Task Tracker">
    <h1>Task Tracker</h1>
    <p class="sub">CRUD with <strong>vanilla JavaScript</strong>: arrays, DOM, events.</p>

    <!-- STEP 1: Form (we'll handle submission via addEventListener and preventDefault) -->
    <form id="todo-form" autocomplete="off">
        <input id="todo-input" name="task" type="text" placeholder="Add a new task…" required minlength="1" />
        <button type="submit" class="primary">Add Task</button>
    </form>

    <div class="row">
        <p class="muted">Pending: <span id="count">0</span></p>
        <p class="muted" id="status" aria-live="polite"></p>
    </div>

    <!-- STEP 2: Rendered list goes here. aria-live makes updates announced by screen readers -->
    <ul id="todo-list" aria-live="polite"></ul>

    <p class="empty" id="empty-state">No tasks yet — add your first one above.</p>
</div>

<script>
    // ====== STEP 0: App State ======
    // We'll keep tasks in an array of objects { id, text, completed }
    let tasks = [];

    // Small helper to create unique-ish IDs.
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // ====== STEP 1: Grab DOM elements (querySelector) ======
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const countEl = document.querySelector('#count');
    const statusEl = document.querySelector('#status');
    const emptyEl = document.querySelector('#empty-state');

    // ====== STEP 2: Render function ======
    function render() {
        // If no tasks, show empty state and clear list
        if (tasks.length === 0) {
            list.innerHTML = '';
            emptyEl.style.display = 'block';
            updateCount();
            return;
        }
        emptyEl.style.display = 'none';

        // Build list items with innerHTML for structure, then set textContent for safety
        list.innerHTML = tasks.map(t => `
        <li class="todo ${t.completed ? 'completed' : ''}" data-id="${t.id}">
          <label>
            <input type="checkbox" class="toggle" ${t.completed ? 'checked' : ''} />
            <span class="text"></span>
          </label>
          <div class="actions">
            <button class="btn btn-danger delete" aria-label="Delete task">Delete</button>
          </div>
        </li>
      `).join('');

        // Now set actual text with textContent to avoid injecting HTML
        list.querySelectorAll('li.todo').forEach((li, idx) => {
            li.querySelector('.text').textContent = tasks[idx].text; // <- textContent
        });

        updateCount();
    }

    function updateCount() {
        const remaining = tasks.filter(t => !t.completed).length; // <- filter
        countEl.textContent = String(remaining);                  // <- textContent
    }

    function setStatus(msg, ok = true) {
        statusEl.textContent = msg; // <- textContent
        statusEl.style.color = ok ? 'var(--accent-2)' : 'var(--danger)';
        // Clear after a moment
        clearTimeout(setStatus._t);
        setStatus._t = setTimeout(() => (statusEl.textContent = ''), 1500);
    }

    // ====== STEP 3: Create (handle form submit + preventDefault) ======
    form.addEventListener('submit', (event) => {
        event.preventDefault(); // <- preventDefault() stops page reload

        const text = input.value.trim();
        if (!text) {
            setStatus('Please type something first', false);
            return;
        }

        tasks.push({ id: uid(), text, completed: false }); // <- arrays + push
        input.value = '';
        render();
        setStatus('Task added');
    });

    // ====== STEP 4: Read/Update/Delete via Event Delegation ======
    // We attach ONE listener to the <ul> and inspect event.target to know what was clicked.
    list.addEventListener('click', (event) => {
        const li = event.target.closest('li.todo'); // <- event object + closest
        if (!li) return;
        const id = li.dataset.id;                   // <- dataset to retrieve the id

        // DELETE
        if (event.target.matches('button.delete')) {
            tasks = tasks.filter(t => t.id !== id);   // <- filter to remove
            render();
            setStatus('Task deleted');
            return;
        }

        // TOGGLE COMPLETE (Update)
        if (event.target.matches('input.toggle')) {
            const t = tasks.find(t => t.id === id);   // <- find
            if (!t) return;
            t.completed = event.target.checked;
            // Reflect in DOM immediately with classList
            li.classList.toggle('completed', t.completed); // <- classList.toggle
            updateCount();
            setStatus(t.completed ? 'Marked complete' : 'Marked active');
            return;
        }
    });

    // ====== STEP 5: Initial render ======
    render();

    // ====== BONUS: Persistence (uncomment to enable localStorage) ======
    // function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }
    // function load() { try { tasks = JSON.parse(localStorage.getItem('tasks')||'[]') } catch { tasks = [] } }
    // window.addEventListener('beforeunload', save);
    // load(); render();
</script>
</body>
</html>
